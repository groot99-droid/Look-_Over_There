name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4          # the .blend is in Git LFS and is not part of the site, so LFS is not fetched
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r monsters _site/monsters
          cp -r characters _site/characters
          cp -r shared _site/shared
          cp -r models _site/models
          cp -r world _site/world
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
