<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Look Over There</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#8a8a7a;font:14px/1.4 system-ui,sans-serif;letter-spacing:.08em;z-index:5;transition:opacity .6s}
  #fear{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(120,0,0,.85) 100%);z-index:2}
  #fade{position:fixed;inset:0;pointer-events:none;opacity:0;background:#000;z-index:3;transition:opacity .35s}
  #lobby{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#050505;color:#b8b8a8;font:15px/1.5 system-ui,sans-serif;z-index:6}
  #lobby form{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw)}
  #lobby h1{margin:0 0 6px;font:700 28px/1 Georgia,serif;letter-spacing:.18em;color:#cfcfbf}
  #lobby input,#lobby button{font:inherit;padding:10px 12px;border:1px solid #3a3a32;background:#111;color:#e6e6d6;border-radius:3px}
  #lobby button{cursor:pointer;letter-spacing:.06em}
  #lobby button.go{background:#2b2a1c;border-color:#6d6a3d}
  #lobby small{color:#7a7a6a}
  #l-err{color:#d46a5a;min-height:1.4em}
  #hud{position:fixed;left:12px;top:10px;color:#9a9a8a;font:12px/1.5 system-ui,sans-serif;letter-spacing:.06em;z-index:1;pointer-events:none;text-shadow:0 0 4px #000}
  #death{position:fixed;inset:0;pointer-events:none;opacity:0;background:#000;display:flex;align-items:center;justify-content:center;color:#a00;font:700 clamp(28px,6vw,64px)/1 Georgia,serif;letter-spacing:.2em;z-index:4;transition:opacity 1.1s}
</style>
</head>
<body>
<div id="load">LOADING</div>
<div id="fear"></div>
<div id="fade"></div>
<div id="death">YOU DIED</div>
<div id="hud"></div>
<div id="lobby"><form id="l-form" autocomplete="off">
  <h1>LOOK OVER THERE</h1>
  <input id="l-name" placeholder="Your name" maxlength="16">
  <input id="l-room" placeholder="Room code (share it with friends)" maxlength="8">
  <button class="go" id="l-join" type="submit">JOIN ROOM</button>
  <button id="l-solo" type="button">PLAY SOLO</button>
  <div id="l-err"></div>
  <small>Everyone in a room shares the building and its monsters. Doors you open stay open for all.</small>
</form></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const MON_URL = "world/monsters.json";

const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({antialias: true});

const scene = new THREE.Scene();

// ---------------------------------------------------------------- world: one scene at a time
const draco = new DRACOLoader(); draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");

const S = {id: null, floor: 0, root: null, boxes: [], grid: new Map(), doors: [], cams: [], nav: null, mapLayer: null, markers: []};

    const d = ax === "x" ? dx : dz; if (!d) continue;

// ---------------------------------------------------------------- fall catch: anything that drops far below this scene's floor is put back on it

// ---------------------------------------------------------------- navigation grid per floor (monsters walk the same colliders the player does; doors are passable for them)

const monsters = [];

const MON_STATES = ["patrol", "chase", "search"];

    if (q.get("room") && q.get("auto")) $("l-form").requestSubmit();

}

// ---------------------------------------------------------------- game loop
let dead = false, deadT = 0, rumbleT = 0, deathLevel = "B1";
function die() {
  dead = true; deadT = 0; deathLevel = S.id; devOn.v = false;
  $("death").style.opacity = 1; $("fear").style.opacity = 1;
  rumble?.playEffect?.("dual-rumble", {duration: 700, strongMagnitude: 1, weakMagnitude: 1});
}
function respawn() {
  dead = false; teleport(randomSpawn(deathLevel)); P.yaw = Math.random() * 6.28; P.pitch = 0; P.crouch = false;
  if (!net.on) for (const m of monsters) { m.state = "patrol"; m.path = []; m.lost = 0; m.last = null; }   // in a room the monsters belong to everyone, so they are not reset for you
  $("death").style.opacity = 0; $("fear").style.opacity = 0;
}
// the host runs the scene's monsters against everyone on the floor; the others follow its snapshots. Alone (or offline) you are always the host.
function targetList() {
  const out = [];
  if (!dead && !loading) out.push({id: net.id, x: P.p.x, y: P.p.y, z: P.p.z, crouch: P.crouch, moving: P.moving});
  if (net.on) for (const p of net.peers.values()) if (p.scene === S.id && !p.dead) out.push({id: p.id, x: p.tx, y: p.ty, z: p.tz, crouch: !!p.crouch, moving: !!p.moving});
  return out;
}
function simMonsters(dt) {
  let caught = false;
  if (net.host()) {
    const targets = targetList();
    for (const m of monsters) {
      for (const id of m.update(dt, targets).caught) { if (id === net.id) caught = true; else net.send({t: "caught", to: id}); }
    }
  } else monsters.forEach((m, i) => m.follow(dt, net.snap && net.snap.l[i]));
  return caught;
}
function update(dt) {
  if (loading) return;
  updateDoors(dt);
  if (dead) { deadT += dt; if (net.on) simMonsters(dt); if (deadT > 3.2) respawn(); return; }
  const g = pad();
  P.yaw += (((keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0)) * 1.9 - g.lx * 2.6) * dt;
  P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch - g.ly * 2.0 * dt));
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - g.mz;
  const side = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + g.mx;
  P.crouch = !!(keys.ShiftLeft || keys.ShiftRight || g.crouch);
  P.moving = Math.hypot(fwd, side) > 0.2;
  const sp = (P.crouch ? 2.2 : 5.6) * dt;
  let wx = -Math.sin(P.yaw) * fwd + Math.cos(P.yaw) * side, wz = -Math.cos(P.yaw) * fwd - Math.sin(P.yaw) * side;
  const mag = Math.min(1, Math.hypot(wx, wz)), l = Math.hypot(wx, wz) || 1;
  wx = wx / l * mag * sp; wz = wz / l * mag * sp;
  P.v.y -= 22 * dt;
  if ((keys.Space || g.jump) && P.ground && !P.crouch) { P.v.y = 6.2; P.ground = false; }
  move(wx, 0, wz); move(0, P.v.y * dt, 0);
  checkFall();
  P.eye += ((P.crouch ? 0.95 : EYE) - P.eye) * Math.min(1, dt * 10);
  const caught = simMonsters(dt);
  let closest = 99;                                                        // fear: the nearest monster that is chasing and on your floor, whoever it chases
  for (const m of monsters) if (m.state === "chase" && m.onFloorY(P.p.y)) closest = Math.min(closest, Math.hypot(P.p.x - m.pos.x, P.p.z - m.pos.z));
  const fear = Math.max(0, 1 - closest / 16);
  $("fear").style.opacity = fear * 0.9;
  if (rumble && closest < 8 && (rumbleT -= dt) <= 0) { rumble.playEffect?.("dual-rumble", {duration: 120, strongMagnitude: .5 * fear, weakMagnitude: .7 * fear}); rumbleT = 0.15; }
  if (caught) die();
}
function step(dtOverride) {
  const dt = dtOverride ?? Math.min(clock.getDelta(), 0.05), t = performance.now() / 1000;
  update(dt); updatePeers(dt); netTick(dt);
  camera.position.set(P.p.x, P.p.y + P.eye - (dead ? Math.min(deadT, 0.6) * 1.0 : 0), P.p.z);
  camera.rotation.set(dead ? Math.max(P.pitch - deadT * 0.8, -1.2) : P.pitch, P.yaw, dead ? Math.min(deadT, 1) * 0.6 : 0, "YXZ");
  // the device slides up into view and shows either the camera feed or the map
  devSlide += ((devOn.v ? 1 : 0) - devSlide) * Math.min(1, dt * 9);
  if (!devOn.v && devSlide < 0.02) device.visible = false;
  device.position.set(0.02, -0.5 + devSlide * 0.3 + Math.sin(t * 1.3) * 0.002, -0.5); device.rotation.set(0.3, 0, 0);
  if (device.visible) {
    if (devMode === "map") { screenMesh.material = mapMat; drawMap(t); }
    else {
      const cams = S.cams;
      if (cams.length) {
        camIdx %= cams.length; aimFeed(cams[camIdx], t);
        device.visible = false; renderer.setRenderTarget(rt); renderer.render(scene, feedCam); renderer.setRenderTarget(null); renderer.setViewport(0, 0, innerWidth, innerHeight); device.visible = true;
        feedMat.uniforms.time.value = t % 100; screenMesh.material = feedMat;
      } else { mctx.fillStyle = "#050806"; mctx.fillRect(0, 0, 512, 320); mapTex.needsUpdate = true; screenMesh.material = mapMat; }

function frame() { step(); requestAnimationFrame(frame); }
const clock = new THREE.Clock();
await lobby();
await loadScene("B1");
$("fade").style.transition = "opacity .35s";
$("load").style.opacity = 0; setTimeout(() => $("load").remove(), 700);
window.__game = {net, step, P, monsters, doors, update, teleport, move, collide, boxes, S, loadScene, die, respawn, useDoor, toggleDevice, toggleMode, cycleCam, levelOfY, randomSpawn, openDoor, devOn, get dead() { return dead; }, get mode() { return devMode; }};
frame();
