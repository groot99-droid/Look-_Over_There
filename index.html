<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Look Over There</title>
<style>

  #fear{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(120,0,0,.85) 100%);z-index:2}

</style>
</head>
<body>
<div id="load">LOADING</div>
<div id="fear"></div>
<div id="death">YOU DIED</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {DRACOLoader} from "three/addons/loaders/DRACOLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const GLB = "world/backrooms_L1.glb", JSON_URL = "world/backrooms_L1_colliders.json", MON_URL = "world/monsters.json";
const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 1500);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xfff2d0, 0x30302a, 1.25));
const torch = new THREE.PointLight(0xfff0d0, 14, 16, 1.6);
camera.add(torch); torch.position.set(0, 0, 0.2);
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------------------------------------------------------------- world
const draco = new DRACOLoader(); draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
const data = await (await fetch(JSON_URL)).json();
const gltf = await new Promise((res, rej) => loader.load(GLB, res, undefined, rej));

// ---------------------------------------------------------------- collision: axis-aligned boxes (glTF Y-up) in a hash grid
const boxes = data.colliders.map(c => ({n: c.min, x: c.max}));

// ---------------------------------------------------------------- doors: every door starts closed (leaf shut + a collider) and has to be opened
const FLOOR_Y = {B1: -3.0, L1: 0, L2: 3.2, L3: 6.4, L4: 9.6};
const qy = a => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), a);
const doors = [];
for (const d of data.doors || []) {

  const box = {n: [Math.min(hx, hx + dir[0] * w) - tx, hy, Math.min(hz, hz + dir[1] * w) - tz],

  const leaf = gltf.scene.getObjectByName(d.name);
  const sign = d.swing_deg < 0 ? -1 : 1;
  const dr = {d, box, leaf, p: 0, target: 0, level: d.level, cx: hx + dir[0] * w / 2, cz: hz + dir[1] * w / 2, cy: hy,

const CELL = 8, grid = new Map(), key = (i, k) => i + "," + k;
boxes.forEach((b, id) => {
  for (let i = Math.floor(b.n[0] / CELL); i <= Math.floor(b.x[0] / CELL); i++)
    for (let k = Math.floor(b.n[2] / CELL); k <= Math.floor(b.x[2] / CELL); k++) {
      const kk = key(i, k); if (!grid.has(kk)) grid.set(kk, []); grid.get(kk).push(id);
    }
});

  for (let i = Math.floor((x - r) / CELL); i <= Math.floor((x + r) / CELL); i++)
    for (let k = Math.floor((z - r) / CELL); k <= Math.floor((z + r) / CELL); k++) (grid.get(key(i, k)) || []).forEach(id => out.add(id));

}

}
const levelOfY = y => { let best = "B1", bd = 1e9; for (const [k, v] of Object.entries(FLOOR_Y)) { const d = Math.abs(y - v); if (d < bd) { bd = d; best = k; } } return best; };

// ---------------------------------------------------------------- player
const R = 0.28, H = 1.7, EYE = 1.55, STEP = 0.46;
const P = {p: new THREE.Vector3(), v: new THREE.Vector3(), yaw: 0, pitch: 0, ground: false, crouch: false, eye: EYE, moving: false};

function move(dx, dy, dz) {

  for (const ax of ["x", "z"]) {
    const d = ax === "x" ? dx : dz; if (!d) continue;
    p[ax] += d;
    const b = collide(p);
    if (b) {
      if (b.x[1] - p.y <= STEP && P.ground && !b.door) { const oy = p.y; p.y = b.x[1] + 0.001; if (collide(p)) { p.y = oy; p[ax] -= d; } }

  const b = collide(p);
  if (b) { if (dy < 0) { p.y = b.x[1] + 0.001; P.ground = true; } else p.y = b.n[1] - H - 0.001; P.v.y = 0; }
}
const teleport = pos => { P.p.set(pos[0], pos[1] + 0.02, pos[2]); P.v.set(0, 0, 0); };

// ---------------------------------------------------------------- stairs / hatches between the stacked site levels
const links = data.links || [];
let armed = true;
function checkLinks() {
  let hit = null;
  for (const l of links) {
    const dx = P.p.x - l.position[0], dz = P.p.z - l.position[2], dy = P.p.y - l.position[1];
    if (Math.hypot(dx, dz) < l.radius && Math.abs(dy) < 1.4) { hit = l; break; }

  if (armed) { armed = false; teleport(hit.target.position); }

// ---------------------------------------------------------------- navigation grid per floor (monsters walk the same colliders the player does; doors are passable for them)
const NAV = 0.5, NX0 = -27, NZ0 = -24, NW = Math.ceil(54 / NAV), NH = Math.ceil(54 / NAV);

}
const NAVS = {}; for (const k in FLOOR_Y) NAVS[k] = buildNav(FLOOR_Y[k]);

    if (Math.max(Math.abs(di), Math.abs(dj)) !== r) continue;
    const i = Math.floor((x - NX0) / NAV) + di, j = Math.floor((z - NZ0) / NAV) + dj;

}

  if (a < 0 || b < 0) return null;
  const open = [[0, a]], came = new Map([[a, -1]]), g = new Map([[a, 0]]);
  const [bx, bz] = cellXZ(b);
  const hx = c => { const [x, z] = cellXZ(c); return Math.hypot(x - bx, z - bz); };
  let it = 0;
  while (open.length && it++ < 9000) {
    let mi = 0; for (let k = 1; k < open.length; k++) if (open[k][0] < open[mi][0]) mi = k;
    const [, c] = open.splice(mi, 1)[0];
    if (c === b) { const path = []; for (let q = c; q !== -1; q = came.get(q)) path.push(q); return path.reverse().map(cellXZ); }
    const ci = c % NW, cj = Math.floor(c / NW);
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue;
      const i = ci + di, j = cj + dj; if (i < 0 || j < 0 || i >= NW || j >= NH) continue;
      const n = j * NW + i; if (!walk[n]) continue;
      if (di && dj && (!walk[cj * NW + i] || !walk[j * NW + ci])) continue;
      const ng = g.get(c) + (di && dj ? 1.414 : 1) * NAV;
      if (!g.has(n) || ng < g.get(n)) { g.set(n, ng); came.set(n, c); open.push([ng + hx(n), n]); }
    }

}

// ---------------------------------------------------------------- monsters: one kind per floor (config in world/monsters.json)
const monCfg = await fetch(MON_URL).then(r => r.ok ? r.json() : null).catch(() => null) ||
  {monsters: [{name: "stalker", glb: null, height: 2.3, perLevel: {L1: 3}, patrol: 1.3, alert: 2.6, chase: 5.5, sight: 16, fov: 110, hear: 9}]};
const monsterAssets = {};
for (const m of monCfg.monsters) {
  if (!m.glb) continue;
  try { monsterAssets[m.name] = await new Promise((res, rej) => loader.load(m.glb, res, undefined, rej)); } catch (e) { console.warn("monster model missing, using placeholder:", m.glb); }
}
function placeholderMonster(h) {
  const g = new THREE.Group(), mat = new THREE.MeshStandardMaterial({color: 0x0d0d0f, roughness: .9});
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.22, h * .55, 6, 10), mat); body.position.y = h * .62; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.2, 12, 10), mat); head.position.y = h * .98; head.scale.set(.8, 1.2, .9); g.add(head);
  for (const s of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(.05, .04, h * .36, 6), mat); leg.position.set(s * .09, h * .17, 0); g.add(leg);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(.04, .035, h * .62, 6), mat); arm.position.set(s * .3, h * .6, 0); arm.rotation.z = s * .12; g.add(arm);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.035, 8, 6), new THREE.MeshBasicMaterial({color: 0xff2a1a})); eye.position.set(s * .07, h * .99, -.16); g.add(eye);
  }

}
const monsters = [];
function rng32(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function pickSpots(level, count, rnd, avoid = [], minGap = 9) {
  const walk = NAVS[level], out = []; let tries = 0;
  while (out.length < count && tries++ < 6000) {
    const c = Math.floor(rnd() * NW * NH); if (!walk[c]) continue;
    const [x, z] = cellXZ(c);
    if (links.some(l => Math.abs(l.position[1] - FLOOR_Y[level]) < 2 && Math.hypot(x - l.position[0], z - l.position[2]) < 4)) continue;
    if (out.some(o => Math.hypot(x - o[0], z - o[1]) < minGap)) continue;
    if (avoid.some(o => Math.hypot(x - o[0], z - o[1]) < 16)) continue;

    this.state = "patrol"; this.path = []; this.repath = 0; this.target = null; this.lost = 0; this.wait = 0; this.speed = 0; this.doorT = 0; this.last = null;
    const asset = monsterAssets[cfg.name];

      this.obj.traverse(o => { if (o.geometry && (o.isMesh || o.isSkinnedMesh)) { o.geometry.computeBoundingBox(); bb.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld)); } });

      for (const [k, re] of [["idle", /idle|stand|alert|breath/i], ["walk", /walk|crawl|shamble/i], ["run", /run|sprint|chase/i], ["attack", /attack|bite|swing|scream/i]]) {

      }

  }

    const d = Math.hypot(px - ex, pz - ez), steps = Math.ceil(d / 0.3);
    for (let s = 1; s < steps; s++) {
      const t = s / steps, x = ex + (px - ex) * t, z = ez + (pz - ez) * t, y = ey + (py - ey) * t;
      for (const id of near(x, z, 0.2)) { const b = boxes[id]; if (!b.off && x > b.n[0] && x < b.x[0] && z > b.n[2] && z < b.x[2] && y > b.n[1] && y < b.x[1] && b.x[1] - b.n[1] > 0.6) return false; }

  }

// ---------------------------------------------------------------- spawning: everyone starts on the pool level; dying puts you back on that floor, somewhere random

const keys = {}, padPrev = {};
