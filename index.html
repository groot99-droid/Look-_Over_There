<title>Look Over There</title>
<style>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {DRACOLoader} from "three/addons/loaders/DRACOLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
import {GATED, NEED, newFloor, act as fuseReduce, carrying, unlocked, slotted} from "./shared/fuses.js";
import {SWITCH_FLOORS, NEED_SW, newSwitches, flip as swFlip, swCount, swDone} from "./shared/switches.js";
import {KEYPAD_FLOORS, CODE_LEN, newKeypad, view as kpView, foundCount, find as kpFind, tryCode} from "./shared/keypad.js";
import {LOOT, MAX_ROUNDS, GUN_ROUNDS, newLoot, takeLocker, takePack, roundsAfterPack} from "./shared/loot.js";
import {ALARM_MS, fmtTime} from "./shared/finish.js";
import {MAX_HP, HIT_DMG, newHealth, hurt as hpHurt, regen as hpRegen, revived as hpRevived, downed as hpDowned, mayHit} from "./shared/health.js";
import {pick as pickSpawn} from "./shared/spawn.js";
import {POWER_SOURCES, newPower, throwPower} from "./shared/power.js";

const MON_URL = "world/monsters.json";
// one scene is resident at a time; the floors are joined by doors at the top of the stairs (doors carry a "link" to the scene they open)
const SCENES = {
  B1: {glbs: ["world/B1.glb"], floor: -3.0}, L1: {glbs: ["world/L1.glb"], floor: 0}, L2: {glbs: ["world/L2.glb"], floor: 3.2},
  L3: {glbs: ["world/L3.glb"], floor: 6.4}, L4: {glbs: ["world/L4.glb", "world/Exterior.glb"], floor: 9.6},
};
const $ = id => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 1500);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xfff2d0, 0x30302a, 1.25));
const torch = new THREE.PointLight(0xfff0d0, 14, 16, 1.6);
camera.add(torch); torch.position.set(0, 0, 0.2);
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------------------------------------------------------------- world: one scene at a time
const draco = new DRACOLoader(); draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
const S = {id: null, floor: 0, root: null, boxes: [], grid: new Map(), doors: [], cams: [], nav: null, mapLayer: null, markers: []};
const boxes = S.boxes, doors = S.doors;                       // live arrays: emptied and refilled on every scene change
const qy = a => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), a);
const CELL = 8, key = (i, k) => i + "," + k;
function near(x, z, r) {
  const out = new Set();
  for (let i = Math.floor((x - r) / CELL); i <= Math.floor((x + r) / CELL); i++)
    for (let k = Math.floor((z - r) / CELL); k <= Math.floor((z + r) / CELL); k++) (S.grid.get(key(i, k)) || []).forEach(id => out.add(id));
  return out;
}
let pendingLink = null, loading = false;
function openDoor(dr, byPlayer) {
  if (dr.target !== 0) return;
  if (dr.link && !byPlayer) return;                           // monsters do not use the stair doors
  if (dr.link && isLocked(dr)) { doorLocked(); return; }
  dr.target = 1; dr.at = performance.now(); if (dr.link) pendingLink = dr; else if (net.on) net.send({t: "door", scene: S.id, name: dr.d.name, open: 1});
}
// X / E on an open door shuts it, unless someone is standing in the doorway. Monsters open doors (0.5 s each) but never shut them; the stair doors never shut.
function doorBusy(dr) {
  const inside = (x, y, z) => Math.abs(y - dr.cy) < 1.8 && Math.hypot(x - dr.cx, z - dr.cz) < 1.1;
  if (!dead && inside(P.p.x, P.p.y, P.p.z)) return true;
  for (const p of net.peers.values()) if (p.scene === S.id && inside(p.tx, p.ty, p.tz)) return true;
  return monsters.some(m => inside(m.pos.x, m.fy, m.pos.z));
}
function closeDoor(dr) {
  if (dr.target !== 1 || dr.link || doorBusy(dr)) return false;
  dr.target = 0; dr.at = performance.now();
  if (net.on) net.send({t: "door", scene: S.id, name: dr.d.name, open: 0});
  return true;
}
function updateDoors(dt) {
  for (const dr of doors) {
    if (dr.p === dr.target) continue;
    dr.p = dr.target > dr.p ? Math.min(dr.target, dr.p + dt * 2.8) : Math.max(dr.target, dr.p - dt * 2.8);
    if (dr.leaf) { const e = dr.p * dr.p * (3 - 2 * dr.p); dr.leaf.quaternion.slerpQuaternions(dr.qClosed, dr.qOpen, e); }
    dr.box.off = dr.p > 0.5;
    if (dr.target === 0 && dr.p > 0 && dr.box.off && doorBusy(dr)) { dr.target = 1; dr.at = performance.now(); if (net.on) net.send({t: "door", scene: S.id, name: dr.d.name, open: 1}); }   // somebody stepped into a closing doorway
  }
  if (pendingLink && pendingLink.p > 0.7 && !loading) { const l = pendingLink; pendingLink = null; goLink(l); }
}
function disposeTree(root) {
  root.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    for (const m of [].concat(o.material || [])) { for (const k in m) if (m[k] && m[k].isTexture) m[k].dispose(); m.dispose(); }
  });
}
async function loadGlb(url) { return new Promise((res, rej) => loader.load(url, res, undefined, rej)); }
async function loadScene(id, arrival) {
  if (!net.on && S.id && GATED.includes(S.id) && FZ.st[S.id]) { const n = fuseReduce(FZ.st[S.id], net.id, {a: "release"}); if (n) FZ.st[S.id] = n; }     // solo: a fuse you carry off the floor goes back (a room's server does this)
  loading = true; pendingLink = null; devOn.v = false; net.snap = null; closeKeypad();
  const fade = $("fade"); fade.style.opacity = 1; await new Promise(r => setTimeout(r, 380));
  if (S.root) { scene.remove(S.root); disposeTree(S.root); }
  monsters.forEach(m => m.dispose()); monsters.length = 0; MAPSEEN.clear();
  const cfg = SCENES[id], doc = await (await fetch(`world/${id}.json`)).json();
  const root = new THREE.Group();
  const gl = await Promise.all(cfg.glbs.map(loadGlb));
  for (const g of gl) { g.scene.traverse(o => { if (o.isMesh) { o.matrixAutoUpdate = false; o.updateMatrix(); } }); root.add(g.scene); }
  scene.add(root);
  Object.assign(S, {id, floor: cfg.floor, root, grid: new Map(), cams: doc.cameras || [], mapLayer: null, markers: doc.markers || [], colliders: doc.colliders});
  boxes.length = 0; doors.length = 0;
  for (const c of doc.colliders) boxes.push({n: c.min, x: c.max});
  for (const d of doc.doors || []) {
    const th = d.closed_yaw_deg * Math.PI / 180, dir = [Math.cos(th), -Math.sin(th)];            // the leaf runs along its local +X from the hinge
    const hx = d.hinge[0], hy = d.hinge[1], hz = d.hinge[2], w = d.width, tx = Math.abs(dir[0]) < .5 ? .07 : 0, tz = Math.abs(dir[1]) < .5 ? .07 : 0;
    const box = {n: [Math.min(hx, hx + dir[0] * w) - tx, hy, Math.min(hz, hz + dir[1] * w) - tz],
                 x: [Math.max(hx, hx + dir[0] * w) + tx, hy + (d.height || 2.1), Math.max(hz, hz + dir[1] * w) + tz], door: true, off: false, link: !!d.link};
    const leaf = root.getObjectByName(d.name);
    const sign = d.swing_deg < 0 ? -1 : 1;
    const dr = {d, box, leaf, p: 0, target: 0, link: d.link || null, cx: hx + dir[0] * w / 2, cz: hz + dir[1] * w / 2, cy: hy, dir, th,
                qClosed: qy(th), qOpen: qy(th + sign * 95 * Math.PI / 180)};
    if (leaf) { leaf.matrixAutoUpdate = true; leaf.quaternion.copy(dr.qClosed); leaf.updateMatrix(); }
    boxes.push(box); doors.push(dr);
  }
  S.shutter = null;
  if (id === "L4") { S.shutter = {n: [-2.7, 9.6, 27.0], x: [2.7, 13.0, 27.5], off: POWER.on}; boxes.push(S.shutter); }       // the store's glass doors: shut until the power is on (the opening has no collider in the model)
  boxes.forEach((b, i) => {
    for (let a = Math.floor(b.n[0] / CELL); a <= Math.floor(b.x[0] / CELL); a++)
      for (let k = Math.floor(b.n[2] / CELL); k <= Math.floor(b.x[2] / CELL); k++) {
        const kk = key(a, k); if (!S.grid.has(kk)) S.grid.set(kk, []); S.grid.get(kk).push(i);
      }
  });
  S.nav = buildNav(cfg.floor);
  spawnMonsters();
  if (!net.on && GATED.includes(id)) FZ.st[id] ||= newFloor();
  if (!net.on && SWITCH_FLOORS.includes(id)) SW.st[id] ||= newSwitches();
  if (!net.on && KEYPAD_FLOORS.includes(id)) { KP.local[id] ||= newKeypad(); setKeypad(id, kpView(KP.local[id], Date.now())); }
  if (net.on) { delete SW.st[id]; delete KP.st[id]; }                                              // in a room the server sends the floor's state on arrival; that first state is not news
  if (!net.on) LT.st[id] ||= newLoot(id);
  buildFuseVisuals();
  buildPowerVisuals();
  buildLootVisuals();
  if (arrival && arrival.door) {                              // the door you came through stays open behind you
    const dr = doors.find(x => x.d.name === arrival.door);
    if (dr) { dr.p = dr.target = 1; dr.box.off = true; if (dr.leaf) dr.leaf.quaternion.copy(dr.qOpen); }
  }
  if (arrival && arrival.pos) { teleport(arrival.pos); P.yaw = arrival.face ? Math.atan2(-arrival.face[0], -arrival.face[1]) : P.yaw; P.pitch = 0; }
  else { teleport(spawnFor(id)); P.yaw = Math.random() * Math.PI * 2; }                      // everyone gets their own spot, leaning toward what the floor still needs
  S.arrive = [P.p.x, S.floor, P.p.z];
  armedFall = true; loading = false; net.t = 0;                 // tell the room which floor you are on right away
  fade.style.opacity = 0;
}
function goLink(dr) { const l = dr.link; loadScene(l.scene, {pos: l.arrive, face: l.face, door: l.door}); }
const levelOfY = () => S.id;

// ---------------------------------------------------------------- player
const R = 0.28, H = 1.7, EYE = 1.55, STEP = 0.46;
const WALK_SPEED = 4.0, RUN_SPEED = 7.5, CROUCH_SPEED = 2.2, RUN_S = 4, RECOVER_S = 6, RUN_RESUME = 0.3;       // m/s; run for RUN_S seconds, then a recovery: you can run again once the bar is back to RUN_RESUME
const P = {p: new THREE.Vector3(), v: new THREE.Vector3(), yaw: 0, pitch: 0, ground: false, crouch: false, eye: EYE, moving: false, running: false, stam: 1, tired: false, shotT: 0};
const overlap = (b, p) => !b.off && p.x + R > b.n[0] && p.x - R < b.x[0] && p.z + R > b.n[2] && p.z - R < b.x[2] && p.y + H > b.n[1] && p.y < b.x[1];
function collide(p) { for (const id of near(p.x, p.z, 1.5)) if (overlap(boxes[id], p)) return boxes[id]; return null; }
function move(dx, dy, dz) {
  const p = P.p;
  for (const ax of ["x", "z"]) {
    const d = ax === "x" ? dx : dz; if (!d) continue;
    p[ax] += d;
    const b = collide(p);
    if (b) {
      if (b.x[1] - p.y <= STEP && P.ground && !b.door) { const oy = p.y; p.y = b.x[1] + 0.001; if (collide(p)) { p.y = oy; p[ax] -= d; } }
      else p[ax] -= d;
    }
  }
  p.y += dy; P.ground = false;
  const b = collide(p);
  if (b) { if (dy < 0) { p.y = b.x[1] + 0.001; P.ground = true; } else p.y = b.n[1] - H - 0.001; P.v.y = 0; }
}
const teleport = pos => { P.p.set(pos[0], pos[1] + 0.02, pos[2]); P.v.set(0, 0, 0); };

// ---------------------------------------------------------------- fall catch: anything that drops far below this scene's floor is put back on it
let armedFall = true;
function checkFall() { if (P.p.y < S.floor - 14 && !loading) { teleport(randomSpawn(S.id)); P.pitch = 0; } }

// ---------------------------------------------------------------- navigation grid per floor (monsters walk the same colliders the player does; doors are passable for them)
const NAV = 0.5, NX0 = -27, NZ0 = -24, NW = Math.ceil(54 / NAV), NH = Math.ceil(54 / NAV);
function buildNav(fy) {
  const walk = new Uint8Array(NW * NH);

function connect(name, room, char) {

  return new Promise((resolve, reject) => {
    let ws; try { ws = new WebSocket(url); } catch (e) { return reject(new Error("That server address is not valid.")); }
    const fail = msg => { clearTimeout(timer); net.ready = null; try { ws.close(); } catch (e) {} reject(new Error(msg)); };
    const timer = setTimeout(() => fail("Could not reach the server. Play solo, or run server/server.js and open the game from it."), 5000);
    net.ready = () => { clearTimeout(timer); resolve(); };
    net.started = new Promise(r => { net.startRes = r; });
    ws.onopen = () => ws.send(JSON.stringify({t: "join", room, name, char}));
    ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (m.t === "full") fail("That room is full (8 players)."); else onNet(m); };
    ws.onerror = () => { if (!net.on) fail("Could not reach the server. Play solo, or run server/server.js and open the game from it."); };

// the host runs the scene's monsters against everyone on the floor; the others follow its snapshots. Alone (or offline) you are always the host.
function targetList() {

function update(dt) {
