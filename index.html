<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Look Over There</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#8a8a7a;font:14px/1.4 system-ui,sans-serif;letter-spacing:.08em;z-index:2;transition:opacity .6s}
</style>
</head>
<body>
<div id="load">LOADING</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {DRACOLoader} from "three/addons/loaders/DRACOLoader.js";

const GLB = "world/backrooms_L1.glb", JSON_URL = "world/backrooms_L1_colliders.json";
const loadEl = document.getElementById("load");

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 1500);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xfff2d0, 0x30302a, 1.25));
const torch = new THREE.PointLight(0xfff0d0, 14, 16, 1.6);
camera.add(torch); torch.position.set(0, 0, 0.2);
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------------------------------------------------------------- world
const draco = new DRACOLoader(); draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
const data = await (await fetch(JSON_URL)).json();
const gltf = await new Promise((res, rej) => loader.load(GLB, res, undefined, rej));
gltf.scene.traverse(o => { if (o.isMesh) { o.matrixAutoUpdate = false; o.updateMatrix(); } });
scene.add(gltf.scene);

// ---------------------------------------------------------------- collision: axis-aligned boxes (glTF Y-up) in a hash grid
const CELL = 8, grid = new Map(), key = (i, k) => i + "," + k;
const boxes = data.colliders.map(c => ({n: c.min, x: c.max}));
boxes.forEach((b, id) => {
  for (let i = Math.floor(b.n[0] / CELL); i <= Math.floor(b.x[0] / CELL); i++)
    for (let k = Math.floor(b.n[2] / CELL); k <= Math.floor(b.x[2] / CELL); k++) {
      const kk = key(i, k); if (!grid.has(kk)) grid.set(kk, []); grid.get(kk).push(id);
    }
});
function near(x, z, r) {
  const out = new Set();
  for (let i = Math.floor((x - r) / CELL); i <= Math.floor((x + r) / CELL); i++)
    for (let k = Math.floor((z - r) / CELL); k <= Math.floor((z + r) / CELL); k++) (grid.get(key(i, k)) || []).forEach(id => out.add(id));
  return out;
}
const R = 0.28, H = 1.7, EYE = 1.55, STEP = 0.46;
const P = {p: new THREE.Vector3(), v: new THREE.Vector3(), yaw: 0, pitch: 0, ground: false};
const overlap = (b, p) => p.x + R > b.n[0] && p.x - R < b.x[0] && p.z + R > b.n[2] && p.z - R < b.x[2] && p.y + H > b.n[1] && p.y < b.x[1];
function collide(p) { for (const id of near(p.x, p.z, 1.5)) if (overlap(boxes[id], p)) return boxes[id]; return null; }
function move(dx, dy, dz) {
  const p = P.p;
  for (const ax of ["x", "z"]) {
    const d = ax === "x" ? dx : dz; if (!d) continue;
    p[ax] += d;
    const b = collide(p);
    if (b) {
      if (b.x[1] - p.y <= STEP && P.ground) { const oy = p.y; p.y = b.x[1] + 0.001; if (collide(p)) { p.y = oy; p[ax] -= d; } }
      else p[ax] -= d;
    }
  }
  p.y += dy; P.ground = false;
  const b = collide(p);
  if (b) { if (dy < 0) { p.y = b.x[1] + 0.001; P.ground = true; } else p.y = b.n[1] - H - 0.001; P.v.y = 0; }
}
const spawn = (data.markers.find(m => m.kind === "Spawn") || {position: [0, 0, 0]}).position;
const teleport = pos => { P.p.set(pos[0], pos[1] + 0.02, pos[2]); P.v.set(0, 0, 0); };
teleport(spawn);

// ---------------------------------------------------------------- stairs / hatches: stepping into one carries you to the other end
const links = data.links || [];
let armed = true;                       // after a jump, stay quiet until the player has left every trigger
function linkAt() {
  for (const l of links) {
    const dx = P.p.x - l.position[0], dz = P.p.z - l.position[2], dy = P.p.y - l.position[1];
    if (Math.hypot(dx, dz) < l.radius && Math.abs(dy) < 1.4) return l;
  }
  return null;
}
function checkLinks() {
  const l = linkAt();
  if (!l) { armed = true; return; }
  if (armed) { armed = false; teleport(l.target.position); }
}

// ---------------------------------------------------------------- input: keyboard (WASD + arrows), mouse look, Xbox controller
const keys = {};
addEventListener("keydown", e => { keys[e.code] = true; if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault(); });
addEventListener("keyup", e => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
renderer.domElement.addEventListener("click", () => { if (!navigator.getGamepads().some(g => g)) renderer.domElement.requestPointerLock?.(); });
addEventListener("mousemove", e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  P.yaw -= e.movementX * 0.0024; P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch - e.movementY * 0.0024));
});
const dz = (v, t = 0.16) => Math.abs(v) < t ? 0 : Math.sign(v) * (Math.abs(v) - t) / (1 - t);
function pad() {
  const gp = [...navigator.getGamepads()].find(g => g && g.connected);
  if (!gp) return {mx: 0, mz: 0, lx: 0, ly: 0, jump: false, run: false};
  const a = gp.axes, b = gp.buttons;
  return {mx: dz(a[0] || 0), mz: dz(a[1] || 0), lx: dz(a[2] || 0, 0.12), ly: dz(a[3] || 0, 0.12),
          jump: !!(b[0] && b[0].pressed), run: !!((b[10] && b[10].pressed) || (b[7] && b[7].value > 0.4) || (b[5] && b[5].pressed))};
}

// ---------------------------------------------------------------- loop
loadEl.style.opacity = 0; setTimeout(() => loadEl.remove(), 700);
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const g = pad();
  // looking: right stick, mouse, arrow left/right; walking: left stick, WASD, arrow up/down
  P.yaw += (((keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0)) * 1.9 - g.lx * 2.6) * dt;
  P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch - g.ly * 2.0 * dt));
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - g.mz;
  const side = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + g.mx;
  const sp = (keys.ShiftLeft || keys.ShiftRight || g.run ? 7 : 3.6) * dt;
  let wx = -Math.sin(P.yaw) * fwd + Math.cos(P.yaw) * side, wz = -Math.cos(P.yaw) * fwd - Math.sin(P.yaw) * side;
  const mag = Math.min(1, Math.hypot(wx, wz)); const l = Math.hypot(wx, wz) || 1;
  wx = wx / l * mag * sp; wz = wz / l * mag * sp;
  P.v.y -= 22 * dt;
  if ((keys.Space || g.jump) && P.ground) { P.v.y = 6.2; P.ground = false; }
  move(wx, 0, wz); move(0, P.v.y * dt, 0);
  if (P.p.y < -160) teleport(spawn);
  checkLinks();
  camera.position.set(P.p.x, P.p.y + EYE, P.p.z);
  camera.rotation.set(P.pitch, P.yaw, 0, "YXZ");
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
